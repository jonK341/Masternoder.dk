<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trophy Proof — MasterNoder</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d1b2a; color: #e8f0ff; }
    body { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .card { background: #132238; border: 1px solid #2a3f5f; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .gif { max-width: 240px; border-radius: 12px; display: block; margin-bottom: 12px; }
    .muted { color: #8fa3bf; font-size: 0.9rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #1e3a5f; margin: 2px 4px 2px 0; font-size: 0.8rem; }
    ul { padding-left: 18px; }
    a { color: #6eb5ff; }
    code { font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Trophy proof</h1>
  <p class="muted">Platform-ledger collectible — not on-chain mint unless anchored.</p>
  <div id="root" class="card">Loading…</div>
  <script>
    const params = new URLSearchParams(location.search);
    const editionKey = params.get('edition_key') || '';
    const root = document.getElementById('root');
    if (!editionKey) {
      root.textContent = 'Missing edition_key query parameter.';
    } else {
      fetch('/api/shop/trophies/proof/' + encodeURIComponent(editionKey))
        .then(r => r.json())
        .then(data => {
          if (!data.success) {
            root.textContent = data.error || 'Edition not found';
            return;
          }
          const ed = data.edition || {};
          const meta = data.metadata || {};
          const attrs = (meta.attributes || []).map(a => `<span class="badge">${a.trait_type}: ${a.value}</span>`).join('');
          const prov = (data.provenance || []).map(e => `<li><strong>${e.event_type}</strong> · ${e.at || ''} ${e.to_user_id ? '→ ' + e.to_user_id : ''}</li>`).join('');
          root.innerHTML = `
            ${ed.gif_url ? `<img class="gif" src="${ed.gif_url}" alt="" />` : ''}
            <h2>${meta.name || editionKey}</h2>
            <p class="muted">Owner: <code>${data.owner_id || '—'}</code></p>
            ${ed.license_number ? `<p>License: <code>${ed.license_number}</code></p>` : ''}
            ${ed.battle_stats ? `<p>Combat rating: <strong>${ed.battle_stats.combat_rating ?? '—'}</strong> · ${ed.battle_stats.rarity || ''}</p>` : ''}
            <div>${attrs}</div>
            ${meta.anchor ? `<p>Anchor: <strong>${meta.anchor.status}</strong>${meta.anchor.explorer_url ? ` · <a href="${meta.anchor.explorer_url}">explorer</a>` : ''}</p>` : ''}
            <p><a href="/api/shop/trophies/metadata/${encodeURIComponent(editionKey)}">Metadata JSON</a> · <a href="/wallets?tab=trophies">Wallet</a></p>
            ${prov ? `<h3>Provenance</h3><ul>${prov}</ul>` : ''}
          `;
        })
        .catch(() => { root.textContent = 'Failed to load proof.'; });
    }
  </script>
</body>
</html>
