<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <style>@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.75} }</style>
  <rect width="320" height="180" fill="#4c1d95"/>
