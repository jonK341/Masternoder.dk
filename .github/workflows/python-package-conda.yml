# Dependency and syntax health checks for the Python app.
#
# This replaces the stock "Python Package using Conda" template, which failed
# on every push because the repo has no environment.yml (it is pip-based, see
# requirements*.txt). Gates:
#   1. requirements.txt resolves and installs on the pinned Python version
#   2. pip check finds no broken/conflicting requirements
#   3. pip-audit finds no known CVEs in the installed set
#   4. flake8 finds no syntax errors (E9)
# The full test suite has known pre-existing failures and is run as a
# non-blocking signal until it is stabilized.

name: Python dependencies & syntax

on: [push]

jobs:
  deps-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Extras used by the video/AI features and their tests. moviepy is
          # installed without deps because 2.2.1 still caps Pillow<12 while we
          # require the security-patched Pillow>=12.2 (see requirements-optional.txt).
          python -m pip install "openai>=2.33.0,<3.0" "imageio>=2.33.1,<3.0" "imageio-ffmpeg>=0.4.9,<1.0" "decorator>=4.0.2,<6.0" "proglog<=1.0.0"
          python -m pip install --no-deps "moviepy>=2.1.2,<3.0"

      - name: pip check
        run: |
          # moviepy<->Pillow metadata conflict is expected until Zulko/moviepy#2562 ships.
          out=$(python -m pip check 2>&1 || true)
          echo "$out"
          bad=$(echo "$out" | grep -v '^moviepy 2' | grep -v 'No broken requirements' | grep . || true)
          if [ -n "$bad" ]; then
            echo "Unexpected dependency conflicts:"
            echo "$bad"
            exit 1
          fi

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

      - name: Lint for syntax errors (blocking)
        run: |
          python -m pip install flake8
          flake8 . --count --select=E9 --show-source --statistics \
            --exclude=.venv,node_modules,removed_scripts_backup,external,dist

      - name: Lint full report (informational)
        run: |
          flake8 . --count --exit-zero --select=E9,F63,F7,F82 --statistics \
            --exclude=.venv,node_modules,removed_scripts_backup,external,dist

      - name: Test with pytest (informational, known pre-existing failures)
        continue-on-error: true
        run: |
          python -m pytest tests/ -q -m "not slow"
