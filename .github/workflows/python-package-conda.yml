name: Python Package using Conda

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-production.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-production.txt
        pip install flake8 pytest
    - name: Lint with flake8 (syntax errors / undefined names only)
      run: |
        flake8 . --count --select=E9,F63,F7 --show-source --statistics \
          --exclude=.git,__pycache__,external,mobile,node_modules,removed_scripts_backup,.venv,venv
    - name: Test with pytest (self-contained unit subset)
      timeout-minutes: 10
      run: |
        pytest -o addopts="" -q -p no:cacheprovider $(grep -v '^#' tests/ci_unit_tests.txt)
