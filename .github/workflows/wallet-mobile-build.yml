# Build MN2 Wallet mobile APK on tag push (preview scaffold).
# Publishes unsigned/signed APK artifact; attach to GitHub Release when signing secrets exist.
#
# Tag: wallet-mobile-v0.1.0-preview
# Output: MasterNoder-Wallet-android-v0.1.0-preview.apk

name: Wallet Mobile Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "android-capacitor"
        type: choice
        options:
          - android-capacitor
          - android-twa
  push:
    tags:
      - "wallet-mobile-v*"

env:
  WALLET_MOBILE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'wallet-mobile-v0.1.0-preview' }}

jobs:
  build-android-capacitor:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.target == 'android-capacitor'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/wallet-app/package-lock.json

      - name: Install Capacitor dependencies
        working-directory: mobile/wallet-app
        run: |
          npm ci || npm install
          npx cap add android || true

      - name: Sync Capacitor (remote wallet URL)
        working-directory: mobile/wallet-app
        run: npm run cap:sync

      - name: Build debug APK (unsigned preview)
        working-directory: mobile/wallet-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage release artifact name
        run: |
          mkdir -p dist
          APK="mobile/wallet-app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "APK not found at $APK" >&2
            exit 1
          fi
          cp "$APK" "dist/MasterNoder-Wallet-android-v0.1.0-preview.apk"
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-mobile-apk-${{ env.WALLET_MOBILE_VERSION }}
          path: dist/MasterNoder-Wallet-android-v0.1.0-preview.apk
          if-no-files-found: error

  build-android-twa:
    if: github.event.inputs.target == 'android-twa'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate TWA manifest
        run: |
          test -f mobile/wallet-twa/twa-manifest.json
          node -e "JSON.parse(require('fs').readFileSync('mobile/wallet-twa/twa-manifest.json','utf8'))"
          echo "TWA manifest OK — run bubblewrap locally with signing keystore for signed APK"

      - name: Upload TWA manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-twa-manifest-${{ env.WALLET_MOBILE_VERSION }}
          path: mobile/wallet-twa/twa-manifest.json

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wallet-mobile-v')
    needs: [build-android-capacitor]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: wallet-mobile-apk-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "MN2 Wallet Mobile ${{ github.ref_name }}" \
            --notes "Preview Android APK for MN2 Wallet v2. See docs/WALLET_DOWNLOAD.md#android." \
            dist/MasterNoder-Wallet-android-v0.1.0-preview.apk || \
          gh release upload "${{ github.ref_name }}" dist/MasterNoder-Wallet-android-v0.1.0-preview.apk --clobber
