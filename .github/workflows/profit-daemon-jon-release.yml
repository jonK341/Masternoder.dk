name: The Profit Daemon Jon release

on:
  push:
    tags:
      - "profit-daemon-jon-v*"
      - "pdj-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash profit_daemon_jon/build_release.sh
      - name: Zip artifact
        run: |
          cd dist
          zip -r "TheProfitDaemonJon-linux-x64.zip" TheProfitDaemonJon
      - uses: actions/upload-artifact@v4
        with:
          name: TheProfitDaemonJon-linux-x64
          path: dist/TheProfitDaemonJon-linux-x64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: profit_daemon_jon\build_release.cmd
      - name: Optional Authenticode sign
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) {
            Write-Host "WINDOWS_CERT_PFX not set — skipping Authenticode sign"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "pdj.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $exe = Get-ChildItem -Path dist\TheProfitDaemonJon -Filter TheProfitDaemonJon.exe -Recurse | Select-Object -First 1
          if ($exe) {
            & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
            "SIGNED" | Out-File dist\TheProfitDaemonJon\SIGNED.txt
          }
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist\TheProfitDaemonJon -DestinationPath dist\TheProfitDaemonJon-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TheProfitDaemonJon-windows-x64
          path: dist/TheProfitDaemonJon-windows-x64.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash profit_daemon_jon/build_release.sh
      - name: Zip artifact
        run: |
          cd dist
          zip -r "TheProfitDaemonJon-macos-${{ matrix.arch }}.zip" TheProfitDaemonJon
      - uses: actions/upload-artifact@v4
        with:
          name: TheProfitDaemonJon-macos-${{ matrix.arch }}
          path: dist/TheProfitDaemonJon-macos-${{ matrix.arch }}.zip

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: The Profit Daemon Jon ${{ github.ref_name }}
          files: |
            artifacts/TheProfitDaemonJon-linux-x64/TheProfitDaemonJon-linux-x64.zip
            artifacts/TheProfitDaemonJon-windows-x64/TheProfitDaemonJon-windows-x64.zip
            artifacts/TheProfitDaemonJon-macos-arm64/TheProfitDaemonJon-macos-arm64.zip
            artifacts/TheProfitDaemonJon-macos-x64/TheProfitDaemonJon-macos-x64.zip
          body: |
            **The Profit Daemon Jon ${{ github.ref_name }}** — standalone builds (Linux / Windows / macOS).

            ### What's new in 1.1.0
            - Exchange registry (`data/exchanges_registry.json`) — enable/add venues without hardcoding
            - Local browser control at `http://127.0.0.1:8787/` on daemon start
            - Ladder / maker / cross-trade / wizard read venues from the registry
            - Packaged configs: registry, connectors, venue API

            ### Install
            1. Download the zip for your OS
            2. Unzip
            3. `./TheProfitDaemonJon --wizard` then `--once --profile paper`
            4. Open `http://127.0.0.1:8787/` to manage exchanges

            Source: `bash profit_daemon_jon/install.sh`
            Docker: `docker compose -f profit_daemon_jon/docker-compose.yml up -d`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
