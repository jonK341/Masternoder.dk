name: The Profit Daemon Jon release

on:
  push:
    tags:
      - "profit-daemon-jon-v*"
      - "pdj-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash profit_daemon_jon/build_release.sh
      - name: Zip artifact
        run: |
          cd dist
          zip -r "TheProfitDaemonJon-linux-x64.zip" TheProfitDaemonJon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProfitDaemonJon-linux-x64
          path: dist/TheProfitDaemonJon-linux-x64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: profit_daemon_jon\build_release.cmd
      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\TheProfitDaemonJon -DestinationPath dist\TheProfitDaemonJon-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProfitDaemonJon-windows-x64
          path: dist/TheProfitDaemonJon-windows-x64.zip

  publish-release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: The Profit Daemon Jon ${{ github.ref_name }}
          files: |
            artifacts/TheProfitDaemonJon-linux-x64/TheProfitDaemonJon-linux-x64.zip
            artifacts/TheProfitDaemonJon-windows-x64/TheProfitDaemonJon-windows-x64.zip
          body: |
            **The Profit Daemon Jon** standalone builds.

            1. Download the zip for your OS
            2. Unzip
            3. Run `./TheProfitDaemonJon --status` then `--once --profile paper`

            Source install: `bash profit_daemon_jon/install.sh`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
