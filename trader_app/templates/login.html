<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MN2 Private Control — Unlock</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f17;color:#e6edf6;font:15px -apple-system,Segoe UI,Roboto,sans-serif}
  .box{background:#131a26;border:1px solid #233044;border-radius:14px;padding:30px 28px;width:320px;text-align:center}
  h1{font-size:17px;margin:0 0 4px}.sub{color:#8a97a8;font-size:12px;margin-bottom:18px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #233044;background:#0b0f17;color:#e6edf6;font-size:15px;margin-bottom:12px}
  button{width:100%;padding:11px;border:0;border-radius:9px;background:#5b9cff;color:#06101f;font-weight:800;font-size:15px;cursor:pointer}
  .err{color:#f2607d;font-size:13px;margin-bottom:10px}
  .lock{font-size:26px;margin-bottom:8px}
</style></head>
<body>
  <form class="box" method="post" action="/login">
    <div class="lock">🔒</div>
    <h1>MN2 Private Control</h1>
    <div class="sub">Owner-only. Enter your passcode.</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" id="pc" name="passcode" placeholder="Passcode" autofocus autocomplete="current-password"/>
    <label style="display:flex;align-items:center;gap:6px;color:#8a97a8;font-size:12px;margin:-4px 0 12px;cursor:pointer">
      <input type="checkbox" id="showpc" style="width:auto"/> Show passcode
    </label>
    <button type="submit">Unlock</button>
  </form>
  <script>
    document.getElementById('showpc').addEventListener('change',function(){
      document.getElementById('pc').type=this.checked?'text':'password';
    });
  </script>
</body></html>
