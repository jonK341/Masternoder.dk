<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MN2 Laptop Trader</title>
<style>
  :root{--bg:#0b0f17;--card:#131a26;--line:#233044;--txt:#e6edf6;--mut:#8a97a8;--pos:#31d0aa;--neg:#f2607d;--acc:#5b9cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0f17ee;backdrop-filter:blur(6px)}
  h1{font-size:16px;margin:0;font-weight:650}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.paper{background:#1e2a3d;color:var(--acc)}
  .badge.live{background:#3a1622;color:var(--neg)}
  .kpis{display:flex;gap:22px;margin-left:auto}
  .kpi{text-align:right}.kpi .l{color:var(--mut);font-size:11px}.kpi .v{font-size:18px;font-weight:700}
  .pos{color:var(--pos)}.neg{color:var(--neg)}
  main{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .full{grid-column:1/3}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600}
  td.r,th.r{text-align:right}
  .pill{padding:2px 8px;border-radius:6px;font-size:11px;background:#1e2a3d;color:var(--acc)}
  .pill.no{background:#2a2233;color:var(--mut)}
  .pill.halt{background:#3a1622;color:var(--neg)}
  button{background:var(--acc);color:#06101f;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:#1a2536;color:var(--txt)}
  .muted{color:var(--mut)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>MN2 Laptop Trader</h1>
  <span id="mode" class="badge paper">paper</span>
  <span class="muted" id="site"></span>
  <div class="kpis">
    <div class="kpi"><div class="l">Total balance</div><div class="v" id="totbal">—</div></div>
    <div class="kpi"><div class="l">Realized PnL</div><div class="v" id="pnl">—</div></div>
    <div class="kpi"><div class="l">Open orders</div><div class="v" id="oo">—</div></div>
  </div>
</header>
<main>
  <section class="card full">
    <div class="row">
      <h2 style="margin:0">Bot control</h2>
      <span id="enabled" class="pill no">disabled</span>
      <button id="toggle" class="ghost">Enable</button>
      <button id="tick">Run tick (paper)</button>
      <span class="muted" id="ctrlmsg"></span>
      <span class="muted" style="margin-left:auto" id="ts"></span>
    </div>
  </section>

  <section class="card">
    <h2>Account balances (per venue / pair)</h2>
    <div id="balances"><span class="muted">Loading…</span></div>
  </section>

  <section class="card">
    <h2>Grid positions &amp; PnL</h2>
    <div id="positions"><span class="muted">Loading…</span></div>
  </section>

  <section class="card full">
    <h2>Cross-trade signals (from site daemon)</h2>
    <div id="signals"><span class="muted">Loading…</span></div>
  </section>
</main>

<script>
function money(n){var v=Number(n||0);return (v<0?'-$':'$')+Math.abs(v).toFixed(2);}
function cls(n){return Number(n||0)>=0?'pos':'neg';}
function el(id){return document.getElementById(id);}

function renderBalances(b){
  var host=el('balances');
  if(!b||!b.success){host.innerHTML='<span class="muted">Unavailable.</span>';return;}
  var html='';
  Object.keys(b.venues||{}).forEach(function(v){
    var row=b.venues[v];
    html+='<div style="margin-bottom:10px"><div class="row"><b>'+v+'</b>';
    html+='<span class="muted" style="margin-left:auto">'+money(row.usd_total)+'</span></div>';
    if(row.error){html+='<div class="muted">'+row.error+'</div>';}
    else{
      html+='<table><thead><tr><th>Asset</th><th class="r">Amount</th><th class="r">USD</th></tr></thead><tbody>';
      (row.assets||[]).slice(0,8).forEach(function(a){
        html+='<tr><td>'+a.symbol+'</td><td class="r">'+Number(a.amount).toFixed(6)+'</td><td class="r">'+money(a.usd_value)+'</td></tr>';
      });
      if(!(row.assets||[]).length)html+='<tr><td colspan="3" class="muted">no balances</td></tr>';
      html+='</tbody></table>';
    }
    html+='</div>';
  });
  host.innerHTML=html+'<div class="row"><span class="muted">Total</span><b style="margin-left:auto">'+money(b.total_usd)+'</b></div>';
}

function renderPositions(g){
  var host=el('positions');
  if(!g||!g.success){host.innerHTML='<span class="muted">Unavailable.</span>';return;}
  var st=g.state||{};var keys=Object.keys(st);
  if(!keys.length){host.innerHTML='<span class="muted">No grid positions yet. Configured: '+(g.assets_configured||[]).join(', ')+'</span>';return;}
  var html='<table><thead><tr><th>Market</th><th class="r">Inventory</th><th class="r">Avg cost</th><th class="r">Realized</th><th class="r">Orders</th><th>State</th></tr></thead><tbody>';
  keys.forEach(function(k){var s=st[k];
    var state=s.halted?'<span class="pill halt">halted: '+(s.halt_reason||'')+'</span>':'<span class="pill">active</span>';
    html+='<tr><td>'+k+'</td><td class="r">'+Number(s.inventory_base||0).toFixed(6)+'</td><td class="r">'+money(s.avg_cost_usd)+'</td><td class="r '+cls(s.realized_pnl_usd)+'">'+money(s.realized_pnl_usd)+'</td><td class="r">'+(s.open_orders||0)+'</td><td>'+state+'</td></tr>';
  });
  host.innerHTML=html+'</tbody></table>';
}

function renderSignals(sg){
  var host=el('signals');
  var list=(sg&&sg.signals)||[];
  if(!list.length){host.innerHTML='<span class="muted">No signals right now'+(sg&&sg.error?(' ('+sg.error+')'):'')+'.</span>';return;}
  var html='<table><thead><tr><th>Type</th><th>Symbol</th><th>Route</th><th class="r">Net bps / spread</th><th>Actionable</th></tr></thead><tbody>';
  list.slice(0,20).forEach(function(s){
    var route=s.type==='arbitrage'?((s.buy_venue||'?')+'→'+(s.sell_venue||'?')):(s.venue||'');
    var metric=s.type==='arbitrage'?Number(s.net_bps||0).toFixed(1):Number(s.spread_bps||0).toFixed(1);
    var act=s.actionable?'<span class="pill">yes</span>':'<span class="pill no">info</span>';
    html+='<tr><td>'+s.type+'</td><td>'+(s.symbol||'')+'</td><td class="muted">'+route+'</td><td class="r">'+metric+'</td><td>'+act+'</td></tr>';
  });
  host.innerHTML=html+'</tbody></table>';
}

var enabled=false;
function refresh(){
  fetch('/api/overview').then(function(r){return r.json();}).then(function(d){
    var m=el('mode');m.textContent=d.mode;m.className='badge '+(d.mode==='LIVE'?'live':'paper');
    el('site').textContent='signals: '+(d.site_url||'(local)');
    el('totbal').textContent=money((d.balances||{}).total_usd);
    var pnl=(d.profit||{}).realized_pnl_usd||0;var pe=el('pnl');pe.textContent=money(pnl);pe.className='v '+cls(pnl);
    var oo=0;var st=((d.grid||{}).state)||{};Object.keys(st).forEach(function(k){oo+=st[k].open_orders||0;});el('oo').textContent=oo;
    enabled=!!(d.grid||{}).enabled;el('enabled').textContent=enabled?'enabled':'disabled';el('enabled').className='pill '+(enabled?'':'no');
    el('toggle').textContent=enabled?'Disable':'Enable';
    renderBalances(d.balances);renderPositions(d.grid);renderSignals(d.signals);
    el('ts').textContent='updated '+new Date().toLocaleTimeString();
  }).catch(function(e){el('ctrlmsg').textContent='refresh error';});
}
el('toggle').onclick=function(){fetch('/api/bot/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!enabled})}).then(refresh);};
el('tick').onclick=function(){el('ctrlmsg').textContent='running tick…';fetch('/api/bot/tick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dry_run:true})}).then(function(r){return r.json();}).then(function(x){el('ctrlmsg').textContent='tick: realized '+money((x||{}).realized_pnl_usd);refresh();});};
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
