# MasterNoder.dk — root-first nginx config (version-controlled template)
# Deploy to server: /etc/nginx/sites-enabled/masternoder.dk
# Apply: sudo nginx -t && sudo systemctl reload nginx
# Or from PC: python scripts/fix_nginx_root_proxy.py

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name masternoder.dk www.masternoder.dk;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy everything to Flask/uWSGI on :5000
# Flask serves: /, /generator/, /static/, /api/ and 301s /vidgenerator/* → /*
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name masternoder.dk www.masternoder.dk;

    ssl_certificate /etc/letsencrypt/live/masternoder.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masternoder.dk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Custom 502 page (optional — generated by scripts/fix_nginx_502_page.py)
  # error_page 502 503 504 /502.html;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
